<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="悠野社区(UYEA) - 以论坛为主页，分享AI使用心得、工具作品和生活点滴">
    <meta name="theme-color" content="#1A4D3A">
    <meta name="color-scheme" content="light dark">
    <title>悠野社区 | UYEA</title>

    <link rel="canonical" href="https://uyea-files.pages.dev/">
    <link rel="icon" href="/IMAGE/ICO/zhihu.png" type="image/png">
    <link rel="apple-touch-icon" href="/IMAGE/ICO/zhihu.png">

    <meta property="og:title" content="悠野社区 | UYEA">
    <meta property="og:description" content="悠野社区 - 以论坛为主页，分享AI使用心得、工具作品和生活点滴">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://uyea-files.pages.dev/">
    <meta property="og:image" content="https://uyea-files.pages.dev/IMAGE/JPG/Peter_Thomas(2-2).webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="UYEA">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/CSS/style.css?v=0.6.38" as="style" fetchpriority="high">
    <link rel="preload" href="/JS/config.js?v=0.6.38" as="script">

    <!-- 关键内联CSS：首屏渲染不等待外部CSS下载 -->
    <style>
        :root{--primary:#1A4D3A;--primary-gradient:linear-gradient(135deg,#1A4D3A 0%,#2D6A4F 100%);--accent:#B45309;--ink:#292524;--bg:#F7F3ED;--surface:#FFFFFF;--surface-warm:#FFFBF5;--border:#E7DFD3;--glass-bg:rgba(255,251,245,0.18);--glass-border:rgba(255,255,255,0.25);--glass-highlight:rgba(255,255,255,0.9);--text-primary:#292524;--text-secondary:#57534E;--text-muted:#A8A29E;--header-h:64px;--radius-md:10px;--radius-sm:6px;--shadow-sm:0 1px 3px rgba(41,37,36,0.08);--font-serif:'Playfair Display','Noto Serif SC',Georgia,serif}
        *{margin:0;padding:0;box-sizing:border-box}
        html{overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif}
        body{background:var(--bg);color:var(--text-primary);line-height:1.6}
        .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        .top-header{width:100%;height:var(--header-h);background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:1000;box-shadow:inset 0 1px 0 var(--glass-highlight)}
        .header-container{height:100%;max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
        .logo-text{font-family:var(--font-serif);font-size:clamp(22px,4vw,30px);font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:clamp(1px,0.4vw,2px);white-space:nowrap}
        .main-content{width:100%;padding:24px 20px;min-height:calc(100vh - var(--header-h))}
        .content-wrapper{max-width:1400px;margin:0 auto;width:100%}
        .section-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .section-title{font-family:var(--font-serif);font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--ink);letter-spacing:-0.5px}
        .section-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}
        .post-list{display:flex;flex-direction:column;gap:10px}
        .post-item{display:block;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);border-left:3px solid var(--accent)}
        .post-title{font-family:var(--font-serif);font-size:16px;font-weight:700;margin-bottom:6px;color:var(--ink)}
        .post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-muted)}
        .post-tag{padding:3px 10px;background:#FFFBEB;border-radius:12px;font-size:11px;font-weight:600;color:#92400E;border:1px solid #FEF3C7}
        .post-excerpt{font-size:13px;color:var(--text-secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .main-content{padding-bottom:140px}
        /* 关键响应式：防止FOUC */
        @media(max-width:1024px){.header-container,.content-wrapper{max-width:960px}}
        @media(max-width:900px){.nav-links{display:none}.menu-toggle{display:flex}}
        @media(max-width:600px){.main-content{padding:16px 12px 110px}.header-right{gap:8px}.lang-btn{padding:6px 10px;min-width:40px;font-size:12px}.header-actions{gap:6px;padding-left:8px}.post-item{padding:14px 16px}.post-title{font-size:15px}}
        @media(max-width:480px){.main-content{padding:12px 10px 110px}.header-container{padding:0 14px}.post-item{padding:12px 14px}.post-title{font-size:14px}.post-excerpt{font-size:12px}}
        
        @media(max-width:320px){.main-content{padding:10px 8px 100px}.header-container{padding:0 10px}.logo-text{font-size:20px}.post-item{padding:10px 12px}.post-title{font-size:13px}}
        @media(max-width:900px) and (orientation:landscape){.top-header{height:48px}.main-content{padding-top:12px;padding-bottom:90px}}
        @media(min-width:1401px){.header-container,.content-wrapper{max-width:1600px;padding:0 32px}.main-content{padding:32px 32px 150px}.post-item{padding:20px 24px}}
        /* iOS安全区域 */
        @supports(padding:env(safe-area-inset-top)){.top-header{padding-top:env(safe-area-inset-top)}.bottom-nav{bottom:calc(20px + env(safe-area-inset-bottom))}.back-to-top{bottom:calc(140px + env(safe-area-inset-bottom))}}
    </style>

    <link rel="stylesheet" href="/CSS/style.css?v=0.6.38" media="all">

    <!-- 异步加载字体：衬线标题 + 无衬线正文 -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>

    <!-- 防止暗色模式闪烁：在CSS加载前应用主题 -->
    <script>
        (function(){var t;try{t=localStorage.getItem('uyea_theme')}catch(e){t=null}if(!t)t=(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t!=='light')document.documentElement.setAttribute('data-theme',t);})();
    </script>
</head>
<body data-lang="zh-CN">
    <div class="scroll-progress"></div>
    <h1 class="sr-only">UYEA 悠野社区 - 论坛主页</h1>

    <!-- 顶部导航栏 -->
    <header class="top-header" data-liquid-glass data-lg-strength="0.4">
        <div class="header-container">
            <a href="/" class="logo-text">UYEA</a>
            <div class="header-right">
                <nav class="nav-links">
                    <a href="/" class="nav-link active" data-i18n="nav.forum">悠野社区</a>
                    <a href="navigation" class="nav-link" data-i18n="nav.home">网站导航</a>
                    <a href="tools" class="nav-link" data-i18n="nav.tools">线上工具</a>
                </nav>
                <div class="lang-selector" id="langSelector">
                    <button class="lang-icon-btn" id="langIconBtn" aria-label="切换语言">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span class="lang-current" id="langCurrent">中</span>
                    </button>
                    <div class="lang-dropdown" id="langDropdown">
                        <button class="lang-option active" data-lang="zh-CN">中文</button>
                        <button class="lang-option" data-lang="zh-TW">繁中</button>
                        <button class="lang-option" data-lang="en">English</button>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="search-icon-btn" id="searchIconBtn" aria-label="搜索">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    <button class="user-btn" aria-label="用户中心" data-coming-soon="用户中心">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <div class="theme-selector">
                        <button class="theme-icon-btn" id="themeIconBtn" aria-label="切换主题">
                            <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            <svg class="theme-icon-geek" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                            <svg class="theme-icon-coffee" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
                        </button>
                        <div class="theme-dropdown" id="themeDropdown">
                            <button class="theme-option active" data-theme="light">浅色</button>
                            <button class="theme-option" data-theme="dark">深色</button>
                            <button class="theme-option" data-theme="geek">极客</button>
                            <button class="theme-option" data-theme="coffee">咖啡</button>
                        </div>
                    </div>
                </div>
                <button class="menu-toggle" id="menuToggleBtn"><span></span><span></span><span></span></button>
            </div>
        </div>

        <!-- 搜索下拉 -->
        <div class="search-dropdown" id="searchDropdown" data-liquid-glass data-lg-strength="0.4">
            <div class="search-engine-tabs" id="searchEngineTabs">
                <button class="engine-tab active" data-value="baidu" data-i18n="search.engine.baidu">百度</button>
                <button class="engine-tab" data-value="google" data-i18n="search.engine.google">Google</button>
                <button class="engine-tab" data-value="bing" data-i18n="search.engine.bing">Bing</button>
                <button class="engine-tab" data-value="site" data-i18n="search.engine.site">站内</button>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="search.placeholder" placeholder="输入关键词搜索...">
                <button class="search-submit-btn" id="searchSubmitBtn" aria-label="搜索">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 移动端下拉菜单 -->
    <div class="dropdown-menu" id="dropdownMenu" data-liquid-glass data-lg-strength="0.5">
        <nav class="menu-nav">
            <a href="/" class="menu-item active" data-i18n="nav.forum">悠野社区</a>
            <a href="navigation" class="menu-item" data-i18n="nav.home">网站导航</a>
            <a href="tools" class="menu-item" data-i18n="nav.tools">线上工具</a>
        </nav>
        <div class="menu-auth-section">
            <button class="register-btn" data-coming-soon="注册"><span data-i18n="btn.register">注册</span></button>
        </div>
    </div>

    <!-- 主内容：论坛布局 -->
    <main class="main-content">
        <div class="content-wrapper">
            <!-- 论坛主体 -->
            <div class="forum-main">
                <div class="section-header">
                    <div>
                        <div class="section-title" data-i18n="nav.forum">悠野社区</div>
                    </div>
                </div>

                <div class="forum-toolbar">
                    <button class="post-btn" data-coming-soon="发布新帖子">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span data-i18n="forum.newPost">发布新帖</span>
                    </button>
                    <div class="forum-search">
                        <span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </span>
                        <input type="text" id="forumSearchInput" data-i18n-placeholder="forum.searchPlaceholder" placeholder="搜索帖子、话题或用户...">
                    </div>
                </div>

                <div class="post-list" id="postList"></div>

                <div class="no-results" id="noResults">
                    <div class="no-results-icon">🔍</div>
                    <div class="no-results-text" data-i18n="forum.noResults">未找到匹配的帖子</div>
                </div>
            </div>
        </div>

        <!-- 底部玻璃导航栏 -->
        <nav class="bottom-nav" id="bottomNav" data-liquid-glass data-lg-strength="0.5">
            <button class="bottom-nav-item active" data-tab="recommend">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4"></path><path d="M9 11V5a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v6"></path><path d="M9 11h6"></path><path d="M9 22V11"></path><path d="M15 11h4a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-4"></path></svg>
                <span data-i18n="bottom.recommend">推荐</span>
            </button>
            <button class="bottom-nav-item" data-tab="follow">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
                <span data-i18n="bottom.follow">关注</span>
            </button>
            <button class="bottom-nav-item" data-tab="favorite">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <span data-i18n="bottom.favorite">收藏</span>
            </button>
        </nav>
    </main>

    <!-- 返回顶部 -->
    <div class="back-to-top" role="button" aria-label="返回顶部" tabindex="0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </div>

    <script src="/JS/liquid-glass.js?v=0.6.38" defer></script>
    <script src="/JS/config.js?v=0.6.38" defer></script>
    <script src="/JS/script.js?v=0.6.38" defer></script>
    <script src="/JS/forum.js?v=0.6.38" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    // 检测到新 Service Worker 激活时自动刷新页面，确保加载最新代码
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        window.location.reload();
                    });
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>
