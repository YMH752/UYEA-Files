    <style>
        :root{--primary:#1A4D3A;--primary-gradient:linear-gradient(135deg,#1A4D3A 0%,#2D6A4F 100%);--accent:#B45309;--ink:#292524;--bg:#F7F3ED;--surface:#FFFFFF;--surface-warm:#FFFBF5;--border:#E7DFD3;--glass-bg:rgba(255,251,245,0.35);--glass-border:rgba(255,255,255,0.6);--glass-highlight:rgba(255,255,255,0.9);--text-primary:#292524;--text-secondary:#57534E;--text-muted:#A8A29E;--header-h:64px;--radius-md:10px;--radius-sm:6px;--shadow-sm:0 1px 3px rgba(41,37,36,0.08);--font-serif:'Playfair Display','Noto Serif SC',Georgia,serif}
        *{margin:0;padding:0;box-sizing:border-box}
        html{overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif}
        body{background:var(--bg);color:var(--text-primary);line-height:1.6}
        .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        .top-header{width:100%;height:var(--header-h);background:var(--glass-bg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:1000;box-shadow:inset 0 1px 0 var(--glass-highlight)}
        .header-container{height:100%;max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
        .logo-text{font-family:var(--font-serif);font-size:clamp(22px,4vw,30px);font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:clamp(1px,0.4vw,2px);white-space:nowrap}
        .main-content{width:100%;padding:24px 20px;min-height:calc(100vh - var(--header-h))}
        .content-wrapper{max-width:1400px;margin:0 auto;width:100%}
        .section-title{font-family:var(--font-serif);font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--ink);letter-spacing:-0.5px}
        .section-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .section-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}
        .category-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:12px}
        .tab-item{padding:10px 18px;background:transparent;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;min-height:44px}
        .tab-item.active{color:var(--primary);background:#ECF5F1;border-bottom:2px solid var(--primary)}
        .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
        .card-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);aspect-ratio:2/1;overflow:hidden;cursor:pointer}
        .card-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:#ECF5F1;flex-shrink:0;font-size:24px}
        .card-title{font-size:clamp(12px,3vw,14px);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .tool-group{margin-bottom:32px}
        .main-content{padding-bottom:140px}

        @media(max-width:1024px){.header-container,.content-wrapper{max-width:960px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

    <!-- 工具页面专属样式 -->
    <style>
        /* 工具卡片可点击指针 */
        .card-item { cursor: pointer; }

        /* ========== 工具模态框 ========== */
        .tool-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(95vw, 700px);
            max-height: 90vh;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            flex-direction: column;
            overflow: hidden;
        }
        .tool-modal.show { display: flex; animation: modalPop 0.2s ease; }

        .tool-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tool-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--ink);
            margin: 0;
        }
        .tool-modal-close {
            width: 34px; height: 34px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            font-size: 22px;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all var(--duration) ease;
        }
        .tool-modal-close:hover { background: var(--accent-5); color: var(--ink); }

        .tool-modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* ========== 工具表单元素 ========== */
        .tool-field { margin-bottom: 16px; }
        .tool-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .tool-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color var(--duration) ease, box-shadow var(--duration) ease;
        }
        .tool-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-lighter);
        }
        .tool-textarea[readonly] { background: var(--surface); }
        .tool-input {
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color var(--duration) ease, box-shadow var(--duration) ease;
        }
        .tool-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-lighter);
        }
        .tool-select {
            height: 40px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
        .tool-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tool-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .tool-error {
            display: none;
            padding: 10px 12px;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 12px;
            border: 1px solid #FECACA;
            word-break: break-word;
        }
        .tool-error.show { display: block; }
        .tool-result-box {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 13px;
            color: var(--text-primary);
            min-height: 44px;
            word-break: break-all;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .tool-info-bar {
            padding: 12px 14px;
            background: var(--primary-lighter);
            border: 1px solid var(--primary-light);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .tool-ts-current {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
        }
        .tool-prefix {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }
        .tool-checkbox {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
        }
        .tool-checkbox input { cursor: pointer; }

        /* 按钮变体（基于 .post-btn） */
        .post-btn-secondary {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .post-btn-secondary:hover { background: var(--primary-lighter); box-shadow: var(--shadow-sm); }
        .post-btn-ghost {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .post-btn-ghost:hover { background: var(--accent-5); box-shadow: var(--shadow-sm); }

        /* 正则高亮 */
        .tool-regex-highlight { line-height: 1.8; }
        .tool-regex-highlight mark {
            background: #FEF3C7;
            color: #92400E;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 600;
        }
        .tool-match-item {
            padding: 8px 10px;
            border-left: 3px solid var(--primary);
            background: var(--primary-lighter);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-bottom: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            white-space: normal;
        }
        .tool-match-item .group-label {
            color: var(--text-muted);
            font-size: 11px;
            margin-right: 4px;
        }

        /* 颜色选择器 */
        .tool-color-preview {
            width: 100%;
            height: 80px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            transition: background-color 0.2s ease;
        }
        .tool-color-picker {
            width: 100%;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            cursor: pointer;
            padding: 4px;
        }

        /* 工具模态框响应式 */
        @media (max-width: 600px) {
            .tool-modal { width: 96vw; max-height: 92vh; }
            .tool-modal-body { padding: 16px; }
            .tool-modal-header { padding: 14px 16px; }
            .tool-modal-title { font-size: 16px; }
            .tool-textarea { min-height: 100px; font-size: 12px; }
            .tool-input { height: 38px; font-size: 13px; }
            .tool-select { height: 38px; font-size: 13px; }
            .tool-actions { gap: 6px; }
            .tool-actions .post-btn { padding: 8px 14px; font-size: 13px; }
        }
        @media (max-width: 380px) {
            .tool-modal { width: 98vw; max-height: 94vh; }
            .tool-modal-body { padding: 12px; }
            .tool-modal-header { padding: 12px 14px; }
            .tool-textarea { min-height: 80px; }
            .tool-actions .post-btn { padding: 7px 12px; font-size: 12px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .tool-modal { width: 90vw; max-height: 85vh; }
            .tool-modal-body { padding: 14px; max-height: 60vh; }
        }
    </style>

    <!-- 异步加载字体：衬线标题 + 无衬线正文 -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

    <!-- 防止暗色模式闪烁：在CSS加载前应用主题 -->
    <script>
        (function(){var t;try{t=localStorage.getItem('uyea_theme')}catch(e){t=null}if(!t)t=(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    </script>
