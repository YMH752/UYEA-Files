    <!-- 关键内联CSS：首屏渲染不等待外部CSS下载 -->
    <style>
        :root{--primary:#1A4D3A;--primary-gradient:linear-gradient(135deg,#1A4D3A 0%,#2D6A4F 100%);--accent:#B45309;--ink:#292524;--bg:#F7F3ED;--surface:#FFFFFF;--surface-warm:#FFFBF5;--border:#E7DFD3;--glass-bg:rgba(255,251,245,0.18);--glass-border:rgba(255,255,255,0.25);--glass-highlight:rgba(255,255,255,0.9);--text-primary:#292524;--text-secondary:#57534E;--text-muted:#A8A29E;--header-h:64px;--radius-md:10px;--radius-sm:6px;--shadow-sm:0 1px 3px rgba(41,37,36,0.08);--font-serif:'Playfair Display','Noto Serif SC',Georgia,serif}
        *{margin:0;padding:0;box-sizing:border-box}
        html{overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',system-ui,sans-serif}
        body{background:var(--bg);color:var(--text-primary);line-height:1.6}
        .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        .top-header{width:100%;height:var(--header-h);background:var(--glass-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:1000;box-shadow:inset 0 1px 0 var(--glass-highlight)}
        .header-container{height:100%;max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
        .logo-text{font-family:var(--font-serif);font-size:clamp(22px,4vw,30px);font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:clamp(1px,0.4vw,2px);white-space:nowrap}
        .main-content{width:100%;padding:24px 20px;min-height:calc(100vh - var(--header-h))}
        .content-wrapper{max-width:1400px;margin:0 auto;width:100%}
        .info-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
        .clock-time-main{font-family:'Courier New',monospace;font-size:clamp(22px,6vw,44px);font-weight:700;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center}
        .section-group{margin-bottom:28px}
        .section-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .section-title{font-family:var(--font-serif);font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--ink);letter-spacing:-0.5px}
        .section-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}
        .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
        .card-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);aspect-ratio:2/1;overflow:hidden}
        .card-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--primary-lighter,#ECF5F1);flex-shrink:0;font-size:24px}
        .card-title{font-size:clamp(12px,3vw,14px);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .main-content{padding-bottom:140px}
        /* 关键响应式：防止FOUC */
        @media(max-width:1024px){.header-container,.content-wrapper{max-width:960px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
        @media(max-width:900px){.nav-links{display:none}.menu-toggle{display:flex}}
        @media(max-width:768px){.info-panel{grid-template-columns:1fr}}
        @media(max-width:600px){.main-content{padding:16px 12px 110px}.header-right{gap:8px}.lang-btn{padding:6px 10px;min-width:40px;font-size:12px}.header-actions{gap:6px;padding-left:8px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}}
        @media(max-width:480px){.main-content{padding:12px 10px 110px}.header-container{padding:0 14px}.grid-container{grid-template-columns:repeat(2,1fr);gap:8px}.card-item{padding:10px 12px}.card-icon{width:32px;height:32px;font-size:20px}}
        
        @media(max-width:320px){.main-content{padding:10px 8px 100px}.header-container{padding:0 10px}.logo-text{font-size:20px}.grid-container{grid-template-columns:1fr}}
        @media(max-width:900px) and (orientation:landscape){.top-header{height:48px}.main-content{padding-top:12px;padding-bottom:90px}}
        @media(min-width:1401px){.header-container,.content-wrapper{max-width:1600px;padding:0 32px}.main-content{padding:32px 32px 150px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}}
        /* iOS安全区域 */
        @supports(padding:env(safe-area-inset-top)){.top-header{padding-top:env(safe-area-inset-top)}.bottom-nav{bottom:calc(20px + env(safe-area-inset-bottom))}.back-to-top{bottom:calc(140px + env(safe-area-inset-bottom))}}
    </style>

    <!-- 异步加载字体：衬线标题 + 无衬线正文 -->

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>

    <!-- 防止暗色模式闪烁：在CSS加载前应用主题 -->
    <script>
        (function(){var t;try{t=localStorage.getItem('uyea_theme')}catch(e){t=null}if(!t)t=(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t!=='light')document.documentElement.setAttribute('data-theme',t);})();
    </script>

<body data-lang="zh-CN">

    <!-- 主内容 -->
    <main class="main-content">
        <div class="content-wrapper">
            <!-- 页面标题 -->
            <div class="section-header">
                <div>
                    <div class="section-title" data-i18n="nav.home">网站导航</div>
                    <div class="section-subtitle" data-i18n="nav.subtitle">AI智能体、生活、工具网站导航，集成时钟日历</div>
                </div>
            </div>

            <!-- 信息面板：时钟 + 日历 + 新组件 -->
            <div class="info-panel">
                <!-- 简约时钟卡片 -->
                <div class="info-card clock-card" id="clockDisplay">
                    <div class="clock-time-main" id="clockTimeMain">00:00:00</div>
                    <div class="clock-date-gregorian" id="clockDateGregorian">2026年1月1日</div>
                    <div class="clock-date-lunar" id="clockDateLunar">（农历正月初一）</div>
                </div>

                <!-- 简约日历卡片 -->
                <div class="info-card calendar-card">
                    <div class="calendar-header">
                        <button class="calendar-nav-arrow" id="prevMonth" aria-label="上个月">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <div class="calendar-title" id="calendarTitle">2026年1月</div>
                        <button class="calendar-nav-arrow" id="nextMonth" aria-label="下个月">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>
                    <div class="calendar-weekdays">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                    <div class="holiday-bar" id="holidayBar"></div>
                </div>

                <!-- 新组件：每日一言 -->
                <div class="info-card quote-card" id="quoteCard">
                    <div class="quote-icon">"</div>
                    <div class="quote-text" id="quoteText">加载中...</div>
                    <div class="quote-author" id="quoteAuthor">—</div>
                    <button class="quote-refresh" id="quoteRefresh" aria-label="换一句">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>

                <!-- 新组件：节日倒计时 -->
                <div class="info-card countdown-card" id="countdownCard">
                    <div class="countdown-label">下一个节日</div>
                    <div class="countdown-name" id="countdownName">—</div>
                    <div class="countdown-days">
                        <span class="countdown-number" id="countdownNumber">0</span>
                        <span class="countdown-unit">天</span>
                    </div>
                    <div class="countdown-date" id="countdownDate">—</div>
                </div>

                <!-- 新组件：快捷操作面板 -->

                        </button>

                            <span>切换主题</span>
                        </button>

                            <span>全屏</span>
                        </button>
                        <button class="quick-action-btn" id="qaToTop" aria-label="返回顶部">

                            <span>返回顶部</span>
                        </button>
                        <button class="quick-action-btn" id="qaShare" aria-label="分享">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>

                            <span>随机访问</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 跳转日期模态框 -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-jump" id="modalJump">

            <input type="number" id="jumpDay" placeholder="日" min="1" max="31">

        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
            <button class="modal-btn modal-btn-confirm" id="modalConfirm">确认</button>
        </div>

    </div>
