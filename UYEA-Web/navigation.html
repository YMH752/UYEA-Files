        .logo-text{font-family:var(--font-serif);font-size:clamp(22px,4vw,30px);font-weight:800;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;letter-spacing:clamp(1px,0.4vw,2px);white-space:nowrap}
        .main-content{width:100%;padding:24px 20px;min-height:calc(100vh - var(--header-h))}
        .content-wrapper{max-width:1400px;margin:0 auto;width:100%}
        .section-group{margin-bottom:28px}
        .section-header{margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .section-title{font-family:var(--font-serif);font-size:clamp(24px,4vw,32px);font-weight:700;color:var(--ink);letter-spacing:-0.5px}
        .section-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}
        .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
        .card-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);aspect-ratio:2.5/1;overflow:hidden}
        .card-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--primary-lighter,#ECF5F1);flex-shrink:0;font-size:18px}
        .card-title{font-size:clamp(11px,2.5vw,13px);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .main-content{padding-bottom:140px}
        /* 关键响应式：防止FOUC */
        @media(max-width:1024px){.header-container,.content-wrapper{max-width:960px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
        @media(max-width:900px){.nav-links{display:none}.menu-toggle{display:flex}}
        @media(max-width:600px){.main-content{padding:16px 12px 110px}.header-right{gap:8px}.lang-btn{padding:6px 10px;min-width:40px;font-size:12px}.header-actions{gap:6px;padding-left:8px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}}
        @media(max-width:480px){.main-content{padding:12px 10px 110px}.header-container{padding:0 14px}.grid-container{grid-template-columns:repeat(2,1fr);gap:8px}.card-item{padding:6px 8px;gap:6px}.card-icon{width:24px;height:24px;font-size:16px}}
        
        @media(max-width:320px){.main-content{padding:10px 8px 100px}.header-container{padding:0 10px}.logo-text{font-size:20px}.grid-container{grid-template-columns:1fr}}
        @media(max-width:900px) and (orientation:landscape){.top-header{height:48px}.main-content{padding-top:12px;padding-bottom:90px}}
        @media(min-width:1401px){.header-container,.content-wrapper{max-width:1600px;padding:0 32px}.main-content{padding:32px 32px 150px}.grid-container{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}}
